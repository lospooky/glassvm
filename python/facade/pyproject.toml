[build-system]
requires = ["maturin[zig]>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "glassvm"
version = "0.3.0"
requires-python = ">=3.12"
description = "Generic Python facade for entry-point-discovered GlassVM machine bundles"
license = "BSD-3-Clause"

[tool.maturin]
module-name = "glassvm"
manifest-path = "Cargo.toml"
