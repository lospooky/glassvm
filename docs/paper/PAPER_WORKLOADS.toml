schema_version = 1
frame_limit = 600
input_schedule = "empty"
frame_capture = "hashes"
evidence_guarantee = "summary"

# These finite workloads validate publication-facing execution and observation
# contracts. They are not a compatibility or performance benchmark by themselves.

[[workload]]
machine_id = "chip8"
artifact_path = "chip8/fixtures/paper/octojam2title.ch8"
source_path = "chip8/fixtures/source/public/octojam2title.ch8"
artifact_sha256 = "010f9ab220f55cc59645a6d05157b33a7099bac01037816ef06b74c2f8339b8a"
origin = "public upstream cartridge; CC0-1.0"
upstream = "https://github.com/JohnEarnest/chip8Archive"
upstream_revision = "761e3ffc63f43e6a849e80714122feff2afca208"
upstream_blob = "6e19074790fe94742e8594b6b109d4946c38d9dc"
rebuild_command = ["python3", "build_paper_workload.py", "--output", "paper/octojam2title.ch8"]
configuration = { quirks = "chip8", cycles_per_frame = 12, machine_seed = 0 }
capability = "chip8.visual_trajectory_motifs"
normalized_event_kinds = ["frame_completed", "display_write", "input_sampled"]
expected_termination = "Timeout"

