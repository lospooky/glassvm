name: Release

on:
  push:
    tags:
      - "v*"
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate release tag and build distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          python-version: "3.14"
          enable-cache: false

      - name: Require release tag and package versions to agree
        shell: bash
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          match = re.fullmatch(r"(?:python-)?v([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if match is None:
              raise SystemExit(f"Expected a vMAJOR.MINOR.PATCH tag, got {tag!r}")
          expected = match.group(1)

          manifests = [
              ("crates/normalizer-contract/Cargo.toml", "package"),
              ("crates/core/Cargo.toml", "package"),
              ("crates/recorder/Cargo.toml", "package"),
              ("crates/query/Cargo.toml", "package"),
              ("crates/registry/Cargo.toml", "package"),
              ("python/facade/pyproject.toml", "project"),
          ]
          for filename, section in manifests:
              with Path(filename).open("rb") as manifest_file:
                  version = tomllib.load(manifest_file)[section]["version"]
              if version != expected:
                  raise SystemExit(
                      f"{filename} declares {version}, but tag {tag} requires {expected}"
                  )

          with Path("python/facade/pyproject.toml").open("rb") as manifest_file:
              project = tomllib.load(manifest_file)["project"]
          for extra, requirements in project["optional-dependencies"].items():
              for requirement in requirements:
                  if requirement.rsplit("==", 1)[-1] != expected:
                      raise SystemExit(
                          f"extra {extra!r} has a dependency not pinned to {expected}: "
                          f"{requirement}"
                      )
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      - name: Dry-run public crate packages
        run: |
          for package in \
            glassvm_normalizer_contract \
            glassvm_core \
            glassvm_recorder \
            glassvm_query \
            glassvm_registry; do
            cargo publish --dry-run --locked --package "$package"
          done

      - name: Build facade sdist and wheel from the sdist
        shell: bash
        run: |
          sdist_dir="$RUNNER_TEMP/glassvm-facade-sdist"
          dist_dir="$RUNNER_TEMP/glassvm-dist"
          mkdir -p "$dist_dir"
          uv build --python 3.14 --sdist --no-sources --out-dir "$sdist_dir" python/facade
          sdist=$(find "$sdist_dir" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          uv build --python 3.14 --wheel --no-sources --out-dir "$dist_dir" "$sdist"
          cp "$sdist" "$dist_dir/"

      - name: Retain facade distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glassvm-facade-dist
          path: ${{ runner.temp }}/glassvm-dist/
          if-no-files-found: error
          retention-days: 7

  publish-crates:
    name: Publish GlassVM contract crates
    needs: validate-and-build
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Authenticate with crates.io Trusted Publishing
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          cargo publish --locked --package glassvm_normalizer_contract
          cargo publish --locked --package glassvm_core
          cargo publish --locked --package glassvm_recorder
          cargo publish --locked --package glassvm_query
          cargo publish --locked --package glassvm_registry

  publish-facade:
    name: Publish generic Python facade
    needs: [validate-and-build, publish-crates]
    if: >-
      ${{
        always() &&
        needs.validate-and-build.result == 'success' &&
        (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          enable-cache: false

      - name: Download facade distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: glassvm-facade-dist
          path: dist/

      - name: Wait for matching bundle releases on PyPI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          tag = os.environ["RELEASE_VERSION"]
          version = tag.removeprefix("python-v").removeprefix("v")
          projects = (
              "glassvm-chip8",
              "glassvm-pico8",
              "glassvm-tic80",
          )
          deadline = time.monotonic() + 45 * 60
          pending = set(projects)
          while pending and time.monotonic() < deadline:
              for project in tuple(pending):
                  url = f"https://pypi.org/pypi/{project}/{version}/json"
                  try:
                      with urllib.request.urlopen(url, timeout=15) as response:
                          if response.status == 200:
                              pending.remove(project)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
              if pending:
                  print(f"Waiting for {version} on PyPI: {', '.join(sorted(pending))}", flush=True)
                  time.sleep(30)
          if pending:
              raise SystemExit(
                  f"Timed out waiting for version {version} of: {', '.join(sorted(pending))}"
              )
          PY

      - name: Publish facade with PyPI Trusted Publishing
        run: uv publish dist/* --trusted-publishing always
