name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate release tag and build distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          python-version: "3.14"
          enable-cache: false

      - name: Require release tag and package versions to agree
        shell: bash
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if match is None:
              raise SystemExit(f"Expected a vMAJOR.MINOR.PATCH tag, got {tag!r}")
          expected = match.group(1)

          manifests = [
              ("crates/normalizer-contract/Cargo.toml", "package"),
              ("crates/core/Cargo.toml", "package"),
              ("crates/recorder/Cargo.toml", "package"),
              ("crates/query/Cargo.toml", "package"),
              ("crates/registry/Cargo.toml", "package"),
              ("python/facade/Cargo.toml", "package"),
              ("python/facade/pyproject.toml", "project"),
          ]
          for filename, section in manifests:
              with Path(filename).open("rb") as manifest_file:
                  version = tomllib.load(manifest_file)[section]["version"]
              if version != expected:
                  raise SystemExit(
                      f"{filename} declares {version}, but tag {tag} requires {expected}"
                  )

          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      - name: Validate public crate packages
        run: |
          # Only the first crate is independent of this release's other crate
          # versions. Dry-running downstream crates here would resolve their
          # 0.1.1 dependencies from crates.io before this release publishes them.
          cargo publish --dry-run --locked --package glassvm_normalizer_contract
          for package in \
            glassvm_core \
            glassvm_recorder \
            glassvm_query \
            glassvm_registry; do
            cargo package --list --locked --package "$package" >/dev/null
          done

      - name: Build facade sdist and wheel from the sdist
        shell: bash
        run: |
          sdist_dir="$RUNNER_TEMP/glassvm-facade-sdist"
          dist_dir="$RUNNER_TEMP/glassvm-dist"
          mkdir -p "$dist_dir"
          uv python install 3.12 3.13 3.14
          uv build --python 3.14 --sdist --no-sources --out-dir "$sdist_dir" python/facade
          sdist=$(find "$sdist_dir" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          for python_version in 3.12 3.13 3.14; do
            MATURIN_PEP517_ARGS="--zig --compatibility pypi" uv build --python "$python_version" --wheel --no-sources --out-dir "$dist_dir" "$sdist"
          done
          cp "$sdist" "$dist_dir/"

      - name: Retain facade distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glassvm-facade-dist
          path: ${{ runner.temp }}/glassvm-dist/
          if-no-files-found: error
          retention-days: 7

  publish-crates:
    name: Publish GlassVM contract crates
    needs: validate-and-build
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Authenticate with crates.io Trusted Publishing
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wait_for_index() {
            crate="$1"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error \
                --user-agent "glassvm-release/1.0 (lospooky)" \
                "https://crates.io/api/v1/crates/$crate/$version" \
                --output /dev/null; then
                return 0
              fi
              echo "Waiting for crates.io to index $crate $version ($attempt/60)"
              sleep 20
            done
            echo "Timed out waiting for crates.io to index $crate $version" >&2
            return 1
          }

          publish_and_wait() {
            package="$1"
            crate="${package//_/-}"
            url="https://crates.io/api/v1/crates/$crate/$version"
            status="$(curl --silent --show-error \
              --user-agent "glassvm-release/1.0 (lospooky)" \
              --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status" == "200" ]]; then
              echo "$crate $version is already published; skipping"
              return 0
            fi
            if [[ "$status" != "404" ]]; then
              echo "Unexpected crates.io response $status while checking $crate $version" >&2
              return 1
            fi
            cargo publish --locked --package "$package"
            wait_for_index "$crate"
          }

          publish_and_wait glassvm_normalizer_contract
          publish_and_wait glassvm_core
          publish_and_wait glassvm_recorder
          publish_and_wait glassvm_query
          publish_and_wait glassvm_registry

  publish-facade:
    name: Publish generic Python facade
    needs: [validate-and-build, publish-crates]
    if: >-
      ${{
        needs.validate-and-build.result == 'success' &&
        needs.publish-crates.result == 'success'
      }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          enable-cache: false

      - name: Download facade distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: glassvm-facade-dist
          path: dist/

      - name: Publish missing facade files with PyPI Trusted Publishing
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          missing="$(python3 scripts/publish_missing_pypi_files.py glassvm "$version" dist/*)" || exit
          files=()
          if [[ -n "$missing" ]]; then
            mapfile -t files <<< "$missing"
          fi
          if ((${#files[@]} == 0)); then
            echo "All glassvm $version files are already published"
            exit 0
          fi
          uv publish "${files[@]}" --trusted-publishing always
