name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

  facade-package:
    name: Build generic Python facade (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.1
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Build facade source distribution and rebuild its wheel
        shell: bash
        run: |
          sdist_dir="$RUNNER_TEMP/glassvm-facade-sdist"
          wheel_dir="$RUNNER_TEMP/glassvm-facade-wheel"
          uv build --python "${{ matrix.python-version }}" --sdist --no-sources --out-dir "$sdist_dir" python/facade
          sdist=$(find "$sdist_dir" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          MATURIN_PEP517_ARGS="--zig --compatibility pypi" uv build --python "${{ matrix.python-version }}" --wheel --no-sources --out-dir "$wheel_dir" "$sdist"
