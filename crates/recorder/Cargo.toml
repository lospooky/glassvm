[package]
name = "glassvm_recorder"
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Bounded file-backed evidence recording and publication for GlassVM."
repository = "https://github.com/lospooky/glassvm"
readme = "../../README.md"
keywords = ["glassvm", "recorder", "evidence"]
categories = ["data-structures", "development-tools"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
glassvm_core = { version = "0.2.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
pyo3 = { version = "0.27", optional = true }
