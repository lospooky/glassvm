[package]
name = "glassvm_core"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Core execution, input, observation, and evidence contracts for GlassVM."
repository = "https://github.com/lospooky/glassvm"
readme = "../../README.md"
keywords = ["glassvm", "emulation", "evidence"]
categories = ["emulators", "simulation"]

[dependencies]
glassvm_normalizer_contract = { version = "0.1.0", path = "../normalizer-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
